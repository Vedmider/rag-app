apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sestacon.fullname" . }}
  labels:
    {{- include "sestacon.labels" . | nindent 4 }}
    {{- include "sestacon.selectorLabels" (dict "ctx" . "component" "app") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sestacon.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sestacon.labels" . | nindent 8 }}
        {{- include "sestacon.selectorLabels" (dict "ctx" . "component" "app") | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: {{ .Values.app.managementPort | quote }}
      {{- end }}
    spec:
      {{- include "sestacon.pullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "sestacon.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ include "sestacon.image" (dict "ctx" . "image" .Values.app.image) }}
          imagePullPolicy: {{ include "sestacon.pullPolicy" (dict "ctx" . "image" .Values.app.image) }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.app.service.port }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.app.managementPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "sestacon.fullname" . }}-config
          env:
            - name: SERVER_PORT
              value: {{ .Values.app.service.port | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sestacon.postgres.secretName" . }}
                  key: {{ .Values.postgres.auth.passwordKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.app.secrets.llmApiKey.existingSecret }}
                  name: {{ .Values.app.secrets.llmApiKey.existingSecret }}
                  {{- else }}
                  name: {{ include "sestacon.fullname" . }}-llm-secret
                  {{- end }}
                  key: {{ .Values.app.secrets.llmApiKey.key }}
            {{- if .Values.app.secrets.embeddingApiKey.existingSecret }}
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.embeddingApiKey.existingSecret }}
                  key: {{ .Values.app.secrets.embeddingApiKey.key }}
            {{- end }}
            {{- if .Values.redis.auth.enabled }}
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sestacon.redis.secretName" . }}
                  key: {{ .Values.redis.auth.passwordKey }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            {{- toYaml .Values.app.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            {{- toYaml .Values.app.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
