{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sestacon.fullname" . }}
  labels:
    {{- include "sestacon.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sestacon.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 15s
{{- end }}
