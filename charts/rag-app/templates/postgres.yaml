{{- if .Values.postgres.enabled }}
{{- if not .Values.postgres.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-app.postgres.secretName" . }}
  labels:
    {{- include "rag-app.labels" . | nindent 4 }}
    {{- include "rag-app.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.passwordKey }}: {{ .Values.postgres.auth.password | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-app.postgres.fullname" . }}
  labels:
    {{- include "rag-app.labels" . | nindent 4 }}
    {{- include "rag-app.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
  selector:
    {{- include "rag-app.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rag-app.postgres.fullname" . }}
  labels:
    {{- include "rag-app.labels" . | nindent 4 }}
    {{- include "rag-app.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "rag-app.postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "rag-app.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-app.labels" . | nindent 8 }}
        {{- include "rag-app.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      {{- include "rag-app.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ include "rag-app.image" (dict "ctx" . "image" .Values.postgres.image) }}
          imagePullPolicy: {{ include "rag-app.pullPolicy" (dict "ctx" . "image" .Values.postgres.image) }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-app.postgres.secretName" . }}
                  key: {{ .Values.postgres.auth.passwordKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}, "-d", {{ .Values.postgres.auth.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}, "-d", {{ .Values.postgres.auth.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.postgres.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.postgres.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
        {{- $sc := include "rag-app.storageClass" (dict "ctx" . "sc" .Values.postgres.persistence.storageClass) }}
        {{- if $sc }}
        storageClassName: {{ $sc }}
        {{- end }}
  {{- end }}
{{- end }}
