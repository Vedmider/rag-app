{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rag-app.serviceAccountName" . }}
  labels:
    {{- include "rag-app.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-app.fullname" . }}
  labels:
    {{- include "rag-app.labels" . | nindent 4 }}
    {{- include "rag-app.selectorLabels" (dict "ctx" . "component" "app") | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
    - name: management
      port: {{ .Values.app.managementPort }}
      targetPort: management
      protocol: TCP
  selector:
    {{- include "rag-app.selectorLabels" (dict "ctx" . "component" "app") | nindent 4 }}
